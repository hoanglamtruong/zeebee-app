services:
  zeebee-app:
    build: .
    image: zeebee-app:latest
    container_name: zeebee-app
    restart: unless-stopped
    ports:
      - "8131:3000"
    # TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID (dùng chung bot Decor) — file .env KHÔNG commit
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ZEEBEE_APP_DB_PATH=/app/data/zeebee-app.db
    volumes:
      - zeebee-app-data:/app/data
    networks:
      - homelab-net

networks:
  homelab-net:
    external: true

volumes:
  zeebee-app-data:
